<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Seventh-day Adventist Church</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="#">Logo + Church Name</a>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Ministries</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">Bible Study</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Contact Us</h1>
        </section>
        <section class="contact">
            <form class="contact-form">
                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >
                <div class="form-row">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required
                    >
                    <input
                        type="tel"
                        name="phone"
                        placeholder="Phone Number"
                    >
                </div>
                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required
                >
                <textarea
                    name="message"
                    rows="10"
                    placeholder="Your Message"
                    required
                ></textarea>
                <button type="submit">Send Message</button>
            </form>
            <aside class="contact-details">
                <div class="map">
                    Map
                </div>
                <div class="address">
                    <h2>Address</h2>
                    <p>
                        Church address goes here.
                    </p>
                </div>
                <div class="contact-info">
                    <h2>Contact Information</h2>
                    <p>Email: info@church.org</p>
                    <p>Phone: +27 XX XXX XXXX</p>
                </div>
            </aside>
        </section>
    </main>
    <footer>
        <div class="footer-contact">
            <p>Church Address</p>
            <p>Phone Number</p>
            <p>Email Address</p>
        </div>
        <div class="footer-social">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
